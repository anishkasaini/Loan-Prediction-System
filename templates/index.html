<!DOCTYPE html>

    <title>Loan Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
</head>
<body>
    <div id="container">
    <h1>Loan Prediction System</h1>
    <form action="/predict" method="POST">

        <br><br>

        <label>Income</label>

        <br><br>

        <button type="submit">Predict</button>
        
    </form>
    </div>
